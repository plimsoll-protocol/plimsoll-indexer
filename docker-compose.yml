# Local stack: Postgres + indexer with the public testnet defaults from .env.example.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plimsoll
      POSTGRES_PASSWORD: plimsoll
      POSTGRES_DB: plimsoll
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plimsoll -d plimsoll"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "54329:5432"

  indexer:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["/plimsoll-indexer", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      DATABASE_URL: postgres://plimsoll:plimsoll@db:5432/plimsoll?sslmode=disable
      PORT: "8080"
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      COVERAGE_LEDGER_ID: CC2QQ7R4FLPHZP7KA5AO4IASXXICTG6N4GQXCXITTEBNYQEYTYXKMN4D
      REPORTER_REGISTRY_ID: CCZCBR7MGSW5LGIEUQR5TU5Z7JQWBDEESB3RGPTRPMCBUMOISRPY7GOB
      START_LEDGER: "5034380"
      # Leave both empty for read-only (API + ingest + toml sync only). Posting
      # needs exactly one of them: setting both is a startup error. Prefer the
      # file, so the secret never appears in the environment, process listing or
      # crash dumps. Uncomment the volume below, create ./supply_poster.secret
      # containing just the seed, and use the commented file path instead.
      SUPPLY_POSTER_SECRET: ""
      # Read on startup; trailing whitespace (a mounted secret's newline) is trimmed.
      SUPPLY_POSTER_SECRET_FILE: ""
      # SUPPLY_POSTER_SECRET_FILE: /run/secrets/supply_poster_secret
# Mount a Docker/Kubernetes secret file rather than passing the seed in the
# environment. Uncomment with the SUPPLY_POSTER_SECRET_FILE line above:
#    volumes:
#      - ./supply_poster.secret:/run/secrets/supply_poster_secret:ro
      INGEST_INTERVAL: 10s
      INGEST_WORKERS: 2
      POST_INTERVAL: 15m
      REPOST_AFTER: 6h
      TOML_INTERVAL: 6h
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
