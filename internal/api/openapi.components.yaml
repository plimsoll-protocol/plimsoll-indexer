# Hand-maintained part of the generated OpenAPI document: schemas, shared
# parameters, shared responses and the auth scheme. Endpoints are not listed
# here; they come from the route table in routes.go. Run `make generate` after
# editing this file.
securitySchemes:
  WebhookAdminAuth:
    type: http
    scheme: bearer
parameters:
  SAC:
    name: sac
    in: path
    required: true
    description: Stellar Asset Contract (SAC) address
    schema:
      type: string
      pattern: '^C[A-Z2-7]{55}$'
      example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
  MinTier:
    name: min_tier
    in: query
    required: false
    description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
    schema:
      type: integer
      enum: [1, 2, 3]
      default: 1
  Limit:
    name: limit
    in: query
    required: false
    description: Maximum number of rows to return (1-1000)
    schema:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
  BreakdownHash:
    name: hash
    in: path
    required: true
    description: SHA-256 breakdown hash, 64 hex characters
    schema:
      type: string
      pattern: '^[0-9a-fA-F]{64}$'
  WebhookID:
    name: id
    in: path
    required: true
    schema:
      type: integer
      minimum: 1
responses:
  InvalidRequest:
    description: Invalid request parameter
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  AssetNotFound:
    description: Asset not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  Unauthorized:
    description: Missing or invalid administrator token
  WebhooksNotConfigured:
    description: Webhook management is not configured
schemas:
  NetworkInfo:
    type: object
    properties:
      network_passphrase:
        type: string
        example: "Public Global Stellar Network ; September 2015"
      rpc_url:
        type: string
        example: "https://mainnet.sorobanrpc.com"
      horizon_url:
        type: string
        example: "https://horizon.stellar.org"
      coverage_ledger_id:
        type: string
        example: "CC456..."
      reporter_registry_id:
        type: string
        example: "CC789..."
    required:
      - network_passphrase
      - rpc_url
      - horizon_url
      - coverage_ledger_id
      - reporter_registry_id
  Supply:
    type: object
    properties:
      amount:
        type: string
        example: "10000000000"
      ledger:
        type: integer
        example: 100
      posted_at:
        type: string
        format: date-time
        example: "2026-10-05T11:00:00Z"
      breakdown_hash:
        type: string
        example: "abc"
      poster:
        type: string
        example: "GPOST..."
      tx_hash:
        type: string
        example: "tx123..."
      source:
        type: string
        enum: [event, chain]
        description: >
          event for a figure decoded from a contract event, which carries the
          transaction that produced it; chain for one recovered from contract
          state after an ingestion gap, where tx_hash is empty.
    required:
      - amount
      - ledger
      - posted_at
      - breakdown_hash
      - poster
      - tx_hash
  Report:
    type: object
    properties:
      tier:
        type: string
        enum: [transcribed, issuer_signed, auditor_signed]
        example: "issuer_signed"
      amount:
        type: string
        example: "10200000000"
      as_of:
        type: string
        format: date-time
        example: "2026-10-05T10:00:00Z"
      posted_at:
        type: string
        format: date-time
        example: "2026-10-05T10:05:00Z"
      reporter:
        type: string
        example: "GISS..."
      doc_hash:
        type: string
        example: "dochash123..."
      doc_uri:
        type: string
        example: "https://x"
      tx_hash:
        type: string
        example: "tx456..."
      source:
        type: string
        enum: [event, chain]
      doc_check:
        type: string
        enum: [match, mismatch, unreachable]
        description: Result of the last document hash verification; absent until checked.
    required:
      - tier
      - amount
      - as_of
      - posted_at
      - reporter
      - doc_hash
      - doc_uri
      - tx_hash
  Coverage:
    type: object
    properties:
      bps:
        type: [integer, "null"]
        example: 10200
      ratio:
        type: [string, "null"]
        example: "102.00%"
      tier:
        type: string
        example: "issuer_signed"
      supply:
        type: string
        example: "10000000000"
      reserves:
        type: string
        example: "10200000000"
      supply_ledger:
        type: integer
        example: 100
      supply_posted_at:
        type: string
        format: date-time
        example: "2026-10-05T11:00:00Z"
      report_as_of:
        type: string
        format: date-time
        example: "2026-10-05T10:00:00Z"
      report_age_seconds:
        type: integer
        example: 7200
      supply_age_seconds:
        type: integer
        example: 3600
      reporter:
        type: string
        example: "GISS..."
      doc_uri:
        type: string
        example: "https://x"
    required:
      - tier
      - supply
      - reserves
      - supply_ledger
      - supply_posted_at
      - report_as_of
      - report_age_seconds
      - supply_age_seconds
      - reporter
      - doc_uri
  Asset:
    type: object
    properties:
      sac:
        type: string
        example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
      code:
        type: string
        example: "PUSD"
      issuer:
        type: string
        example: "GISS..."
      listed_ledger:
        type: integer
        example: 50
      listed_at:
        type: string
        format: date-time
        example: "2026-10-01T00:00:00Z"
      toml:
        type: [object, "null"]
      toml_checked_at:
        type: [string, "null"]
        format: date-time
      toml_error:
        type: [string, "null"]
      supply:
        oneOf:
          - $ref: '#/components/schemas/Supply'
          - type: "null"
      reports:
        type: object
        additionalProperties:
          $ref: '#/components/schemas/Report'
      coverage:
        oneOf:
          - $ref: '#/components/schemas/Coverage'
          - type: "null"
    required:
      - sac
      - code
      - issuer
      - listed_ledger
      - listed_at
      - reports
  Reporter:
    type: object
    properties:
      role:
        type: string
        example: "auditor"
      address:
        type: string
        example: "GAUD..."
      name:
        type: string
        example: "Acme"
      updated_at:
        type: string
        format: date-time
        example: "2026-10-01T00:00:00Z"
    required:
      - role
      - address
      - name
      - updated_at
  Webhook:
    type: object
    properties:
      id:
        type: integer
      url:
        type: string
        format: uri
      created_at:
        type: string
        format: date-time
    required: [id, url, created_at]
  CreatedWebhook:
    allOf:
      - $ref: '#/components/schemas/Webhook'
      - type: object
        properties:
          secret:
            type: string
            description: Returned once; store it securely.
        required: [secret]
  ErrorResponse:
    type: object
    properties:
      error:
        type: string
        example: "asset not listed"
    required:
      - error
