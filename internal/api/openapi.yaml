openapi: 3.1.0
info:
  title: Plimsoll Indexer API
  description: OpenAPI 3.1.0 specification for Plimsoll read API over HTTP.
  version: 1.0.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: https://plimsoll-indexer.onrender.com
    description: Hosted testnet API
  - url: http://localhost:8080
    description: Local development API
security: []
paths:
  /healthz:
    get:
      summary: Health check and indexer sync status
      operationId: healthCheck
      responses:
        '200':
          description: Indexer is healthy and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  ingested_to_ledger:
                    type: integer
                    example: 42
                required:
                  - status
                  - ingested_to_ledger
        '503':
          description: Storage is unreachable or the ingest cursor cannot be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi.yaml:
    get:
      summary: Get OpenAPI 3.1 specification
      operationId: getOpenAPISpec
      responses:
        '200':
          description: OpenAPI specification file
          content:
            application/yaml:
              schema:
                type: string
  /v1/network:
    get:
      summary: Discover network parameters and contract IDs
      operationId: getNetworkInfo
      responses:
        '200':
          description: Network discovery parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInfo'
  /v1/assets:
    get:
      summary: List all tracked assets with coverage and reports
      operationId: listAssets
      parameters:
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
      responses:
        '200':
          description: List of tracked assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                required:
                  - assets
        '400':
          description: Invalid request parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/covered:
    get:
      summary: List only assets that are currently covered
      description: >
        A shortcut for dashboards: the same Asset documents as /v1/assets,
        filtered with the contract's is_covered rule (fresh supply and report,
        coverage at least min_bps, report tier at least min_tier).
        is_covered has no defaults on chain, so this endpoint supplies its
        own: min_bps=10000 (100% backing) and max_age=24h.
      operationId: listCoveredAssets
      parameters:
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
        - name: min_bps
          in: query
          required: false
          description: Minimum coverage in basis points (10000 = 100%)
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
            default: 10000
        - name: max_age
          in: query
          required: false
          description: Maximum age of the supply snapshot and report, as a Go duration
          schema:
            type: string
            example: "24h"
            default: "24h"
        - name: limit
          in: query
          required: false
          description: Maximum number of assets to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of matching assets to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Covered assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  next_offset:
                    type: integer
                    description: Present when another page exists; pass it as offset.
                required:
                  - assets
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{sac}:
    get:
      summary: Get details, latest supply, reports, and coverage for a specific asset
      operationId: getAsset
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
            example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
      responses:
        '200':
          description: Asset details and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          description: Invalid request parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    head:
      summary: Check whether an asset is listed
      operationId: headAsset
      description: >-
        Returns 200 when the asset is listed and 404 when it is not, so clients
        can check existence without downloading the full asset document. The
        response never has a body.
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
            example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
      responses:
        '200':
          description: Asset is listed. No response body.
        '400':
          description: sac is not a contract strkey. No response body.
        '404':
          description: Asset is not listed. No response body.
  /v1/assets/{sac}/supply:
    get:
      summary: Get historical supply snapshots for an asset
      operationId: getSupplyHistory
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
        - name: limit
          in: query
          required: false
          description: Maximum number of snapshots to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Supply history snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supply'
                required:
                  - supply
        '400':
          description: Invalid limit parameter, or sac is not a contract strkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{sac}/reports:
    get:
      summary: Get historical reserve reports for an asset
      operationId: getReportHistory
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
        - name: limit
          in: query
          required: false
          description: Maximum number of reports to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Reserve report history
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                required:
                  - reports
        '400':
          description: Invalid limit parameter, or sac is not a contract strkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{sac}/disputes:
    get:
      summary: List disputes for an asset
      description: >
        Returns disputes opened against the asset's reserve reports, newest
        first. A dispute is keyed by the report's as_of timestamp and records
        the reporter who signed the report and the watcher who challenged it.
        The current contracts do not emit dispute events yet
        (plimsoll-contracts#91); until a deployment does, the list is empty.
      operationId: listAssetDisputes
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
        - name: status
          in: query
          required: false
          description: Restrict to open or resolved disputes; omit for both
          schema:
            type: string
            enum: [open, resolved]
        - name: limit
          in: query
          required: false
          description: Maximum number of disputes to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of disputes to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Disputes for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispute'
                  next_offset:
                    type: integer
                    description: Present when another page exists; pass it as offset.
                required:
                  - disputes
        '400':
          description: Invalid status, limit, offset, or sac
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/reporters:
    get:
      summary: List registered reporters and their roles
      operationId: listReporters
      responses:
        '200':
          description: List of registered reporters
          content:
            application/json:
              schema:
                type: object
                properties:
                  reporters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporter'
                required:
                  - reporters
  /v1/changelog:
    get:
      summary: List breaking changes per released API version
      operationId: getChangelog
      description: >-
        Machine-readable changelog, newest version first, generated from the
        hand-maintained CHANGELOG.yaml. Each version lists the changes that
        break existing clients: removed fields, renamed endpoints and new
        required parameters.
      responses:
        '200':
          description: Breaking changes per version, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  changelog:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangelogEntry'
                required:
                  - changelog
  /v1/webhooks:
    post:
      summary: Register an issuer TOML change webhook
      operationId: createWebhook
      security:
        - WebhookAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://example.com/plimsoll-hook"
              required: [url]
      responses:
        '201':
          description: Webhook created; secret is shown only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhook'
        '400':
          description: Invalid URL or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook management is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List registered webhooks without their secrets
      operationId: listWebhooks
      security:
        - WebhookAdminAuth: []
      responses:
        '200':
          description: Registered webhook destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
                required: [webhooks]
        '401':
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook management is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks/{id}:
    delete:
      summary: Delete a registered webhook
      operationId: deleteWebhook
      security:
        - WebhookAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Webhook deleted
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/breakdowns/{hash}:
    get:
      summary: Get raw supply breakdown by hash
      operationId: getBreakdown
      parameters:
        - name: hash
          in: path
          required: true
          description: SHA-256 breakdown hash, 64 hex characters
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Raw JSON breakdown served verbatim
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Hash is not 64 hex characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Breakdown hash not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    WebhookAdminAuth:
      type: http
      scheme: bearer
  schemas:
    NetworkInfo:
      type: object
      properties:
        network_passphrase:
          type: string
          example: "Public Global Stellar Network ; September 2015"
        rpc_url:
          type: string
          example: "https://mainnet.sorobanrpc.com"
        horizon_url:
          type: string
          example: "https://horizon.stellar.org"
        coverage_ledger_id:
          type: string
          example: "CC456..."
        reporter_registry_id:
          type: string
          example: "CC789..."
      required:
        - network_passphrase
        - rpc_url
        - horizon_url
        - coverage_ledger_id
        - reporter_registry_id
    Supply:
      type: object
      properties:
        amount:
          type: string
          example: "10000000000"
        ledger:
          type: integer
          example: 100
        posted_at:
          type: string
          format: date-time
          example: "2026-10-05T11:00:00Z"
        breakdown_hash:
          type: string
          example: "abc"
        poster:
          type: string
          example: "GPOST..."
        tx_hash:
          type: string
          example: "tx123..."
      required:
        - amount
        - ledger
        - posted_at
        - breakdown_hash
        - poster
        - tx_hash
    Report:
      type: object
      properties:
        tier:
          type: string
          enum: [transcribed, issuer_signed, auditor_signed]
          example: "issuer_signed"
        amount:
          type: string
          example: "10200000000"
        as_of:
          type: string
          format: date-time
          example: "2026-10-05T10:00:00Z"
        posted_at:
          type: string
          format: date-time
          example: "2026-10-05T10:05:00Z"
        reporter:
          type: string
          example: "GISS..."
        doc_hash:
          type: string
          example: "dochash123..."
        doc_uri:
          type: string
          example: "https://x"
        tx_hash:
          type: string
          example: "tx456..."
      required:
        - tier
        - amount
        - as_of
        - posted_at
        - reporter
        - doc_hash
        - doc_uri
        - tx_hash
    Coverage:
      type: object
      properties:
        bps:
          type: [integer, "null"]
          example: 10200
        ratio:
          type: [string, "null"]
          example: "102.00%"
        tier:
          type: string
          example: "issuer_signed"
        supply:
          type: string
          example: "10000000000"
        reserves:
          type: string
          example: "10200000000"
        supply_ledger:
          type: integer
          example: 100
        supply_posted_at:
          type: string
          format: date-time
          example: "2026-10-05T11:00:00Z"
        report_as_of:
          type: string
          format: date-time
          example: "2026-10-05T10:00:00Z"
        report_age_seconds:
          type: integer
          example: 7200
        supply_age_seconds:
          type: integer
          example: 3600
        reporter:
          type: string
          example: "GISS..."
        doc_uri:
          type: string
          example: "https://x"
      required:
        - tier
        - supply
        - reserves
        - supply_ledger
        - supply_posted_at
        - report_as_of
        - report_age_seconds
        - supply_age_seconds
        - reporter
        - doc_uri
    Asset:
      type: object
      properties:
        sac:
          type: string
          example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        code:
          type: string
          example: "PUSD"
        issuer:
          type: string
          example: "GISS..."
        listed_ledger:
          type: integer
          example: 50
        listed_at:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00Z"
        toml:
          type: [object, "null"]
        toml_checked_at:
          type: [string, "null"]
          format: date-time
        toml_error:
          type: [string, "null"]
        supply:
          oneOf:
            - $ref: '#/components/schemas/Supply'
            - type: "null"
        reports:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Report'
        coverage:
          oneOf:
            - $ref: '#/components/schemas/Coverage'
            - type: "null"
      required:
        - sac
        - code
        - issuer
        - listed_ledger
        - listed_at
        - reports
    Reporter:
      type: object
      properties:
        role:
          type: string
          example: "auditor"
        address:
          type: string
          example: "GAUD..."
        name:
          type: string
          example: "Acme"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00Z"
      required:
        - role
        - address
        - name
        - updated_at
    ChangelogEntry:
      type: object
      properties:
        version:
          type: string
          example: "1.2.0"
        date:
          type: string
          format: date
          example: "2026-12-01"
        changes:
          type: array
          description: Breaking changes introduced in this version; empty when there were none.
          items:
            $ref: '#/components/schemas/ChangelogChange'
      required:
        - version
        - date
        - changes
    ChangelogChange:
      type: object
      properties:
        kind:
          type: string
          description: 'What broke: removed_field, renamed_endpoint, new_required_param, and similarly named breakages.'
          example: "removed_field"
        detail:
          type: string
          description: What a client must change.
          example: "coverage.ratio was removed; compute it from bps."
      required:
        - kind
        - detail
    Dispute:
      type: object
      properties:
        reporter:
          type: string
          description: Account that signed the disputed reserve report.
          example: "GISS..."
        disputer:
          type: string
          description: Watcher that opened the dispute.
          example: "GWATCH..."
        status:
          type: string
          enum: [open, resolved]
        resolution:
          type: string
          description: Outcome recorded when the dispute was resolved; empty while open.
          example: "upheld"
        report_as_of:
          type: string
          format: date-time
          description: as_of timestamp of the disputed report.
        hold_until_ledger:
          type: integer
          description: First ledger at which the hold period has elapsed.
        opened_ledger:
          type: integer
        opened_at:
          type: string
          format: date-time
        resolved_ledger:
          type: integer
          description: Ledger the dispute was resolved in; absent while open.
        resolved_at:
          type: string
          format: date-time
          description: When the dispute was resolved; absent while open.
        tx_hash:
          type: string
          description: Transaction that opened or last changed the dispute.
      required:
        - reporter
        - disputer
        - status
        - report_as_of
        - opened_ledger
        - opened_at
    Webhook:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
      required: [id, url, created_at]
    CreatedWebhook:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret:
              type: string
              description: Returned once; store it securely.
          required: [secret]
    ErrorResponse:
      type: object
      description: |
        Body of every 4xx and 5xx response, including the 404 and 405 the
        router writes for an unknown path or method.
      properties:
        code:
          type: string
          description: |
            Machine-readable error identifier. Match on this value, not on
            `message`. Handlers use: not_found, invalid_sac,
            asset_not_listed, invalid_breakdown_hash, breakdown_not_found,
            invalid_min_tier, invalid_limit, invalid_offset, invalid_status,
            invalid_min_bps, invalid_max_age, invalid_body,
            invalid_webhook_url, invalid_webhook_id, webhook_not_found,
            webhooks_not_configured, unauthorized, internal_error,
            db_unavailable and progress_unavailable. The router uses
            not_found, method_not_allowed and internal_error.
          example: asset_not_listed
        message:
          type: string
          description: Human-readable explanation for logs and debugging.
          example: asset not listed
        details:
          type: object
          additionalProperties: true
          description: |
            Optional context identifying what was rejected, such as the
            offending query parameter and its value. Omitted when there is
            nothing to add.
          example:
            parameter: min_tier
            value: "9"
      required:
        - code
        - message
