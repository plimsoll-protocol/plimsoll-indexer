openapi: 3.0.3
info:
  title: Plimsoll Indexer API
  version: 1.0.0
paths:
  /v1/assets/{sac}/reporters:
    get:
      summary: List reporters for a given asset
      parameters:
        - name: sac
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reporter'
  /v1/webhooks/test:
    post:
      summary: Send a test event to a registered webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: integer
components:
  schemas:
    Reporter:
      type: object
      required:
        - reporter
        - tier
        - last_post_at
      properties:
        reporter:
          type: string
        tier:
          type: integer
        last_post_at:
          type: string
          format: date-time
