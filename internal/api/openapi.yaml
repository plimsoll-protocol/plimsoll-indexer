openapi: 3.0.3
info:
  title: Plimsoll Indexer API
  version: 1.0.0
paths:
  /v1/assets/{sac}/reporters:
    get:
      summary: Health check and indexer sync status
      operationId: healthCheck
      responses:
        '200':
          description: Indexer is healthy and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  ingested_to_ledger:
                    type: integer
                    example: 42
                  last_event_ledger:
                    type: integer
                    example: 40
                  last_event_at:
                    type: [string, "null"]
                    format: date-time
                    example: "2026-10-05T11:58:30Z"
                  last_event_age_seconds:
                    type: [integer, "null"]
                    example: 90
                required:
                  - status
                  - ingested_to_ledger
                  - last_event_ledger
                  - last_event_at
                  - last_event_age_seconds
        '503':
          description: Storage is unreachable or the ingest cursor cannot be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi.yaml:
    get:
      summary: Get OpenAPI 3.1 specification
      operationId: getOpenAPISpec
      responses:
        '200':
          description: OpenAPI specification file
          content:
            application/yaml:
              schema:
                type: string
  /v1/network:
    get:
      summary: Discover network parameters and contract IDs
      operationId: getNetworkInfo
      responses:
        '200':
          description: Network discovery parameters
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInfo'
  /v1/version:
    get:
      summary: Report the running build's version, commit and Go version
      operationId: getVersion
      responses:
        '200':
          description: Build information for the running indexer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        '304':
          $ref: '#/components/responses/NotModified'
  /v1/assets:
    get:
      summary: List all tracked assets with coverage and reports
      operationId: listAssets
      parameters:
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
        - name: limit
          in: query
          required: false
          description: Maximum number of assets to return (1-200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as next_cursor by a previous page
          schema:
            type: string
        - $ref: '#/components/parameters/MinTier'
      responses:
        '200':
          description: List of tracked assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  next_cursor:
                    type: string
                    description: Opaque cursor for the next page, present only when another page exists
                required:
                  - assets
        '400':
          description: Invalid request parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/covered:
  /v1/assets/batch-covered:
    post:
      summary: Get coverage status for multiple assets
      operationId: batchAssetCoverage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: string
                pattern: '^C[A-Z2-7]{55}$'
      responses:
        '200':
          description: Coverage status for each requested asset, in request order
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        sac:
                          type: string
                        coverage:
                          oneOf:
                            - $ref: '#/components/schemas/Coverage'
                            - type: "null"
                      required: [sac, coverage]
                required: [assets]
        '400':
          description: Empty, oversized, or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          $ref: '#/components/responses/InvalidRequest'
  /v1/assets/{sac}:
    get:
      summary: List only assets that are currently covered
      description: >
        A shortcut for dashboards: the same Asset documents as /v1/assets,
        filtered with the contract's is_covered rule (fresh supply and report,
        coverage at least min_bps, report tier at least min_tier).
        is_covered has no defaults on chain, so this endpoint supplies its
        own: min_bps=10000 (100% backing) and max_age=24h.
      operationId: listCoveredAssets
      parameters:
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
        - name: min_bps
          in: query
          required: false
          description: Minimum coverage in basis points (10000 = 100%)
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
            default: 10000
        - name: max_age
          in: query
          required: false
          description: Maximum age of the supply snapshot and report, as a Go duration
        - $ref: '#/components/parameters/SAC'
        - $ref: '#/components/parameters/MinTier'
      responses:
        '200':
          description: Asset details and current status
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          $ref: '#/components/responses/AssetNotFound'
  /v1/assets/{sac}/supply:
    get:
      summary: Get historical supply snapshots for an asset
      operationId: getSupplyHistory
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            example: "24h"
            default: "24h"
        - name: limit
          in: query
          required: false
          description: Maximum number of assets to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
        - name: before
          in: query
          required: false
          description: Return snapshots strictly before this ledger (at_ledger < before). Pass next_before from the previous page to walk older history.
          schema:
            type: integer
        - $ref: '#/components/parameters/SAC'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Supply history snapshots
          headers:
            X-Total-Count:
              description: Total number of matching supply snapshots, before applying limit.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  supply:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supply'
                    required:
                      - supply
                  next_before:
                    type: integer
                    description: Ledger of the last returned snapshot. Pass it as `before` to fetch the next older page. Absent when no more rows exist.
                required:
                  - supply
        '400':
          description: Invalid limit parameter, or sac is not a contract strkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/AssetNotFound'
  /v1/assets/{sac}/reports:
    get:
      summary: Get historical reserve reports for an asset
      operationId: getReportHistory
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
        - name: limit
          in: query
          required: false
          description: Number of matching assets to skip
          schema:
            type: integer
            minimum: 0
            default: 0
            minimum: 1
            maximum: 1000
            default: 100
        - name: before
          in: query
          required: false
          description: Return reports strictly before this posted ledger (posted_ledger < before). Pass next_before from the previous page to walk older history.
          schema:
            type: integer
        - $ref: '#/components/parameters/SAC'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Covered assets
          description: Reserve report history
          headers:
            X-Total-Count:
              description: Total number of matching reserve reports, before applying limit.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  next_offset:
                    type: integer
                    description: Present when another page exists; pass it as offset.
                      $ref: '#/components/schemas/Report'
                    required:
                      - reports
                  next_before:
                    type: integer
                    description: Posted ledger of the last returned report. Pass it as `before` to fetch the next older page. Absent when no more rows exist.
                required:
                  - assets
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{sac}:
    get:
      summary: Get details, latest supply, reports, and coverage for a specific asset
      operationId: getAsset
      summary: List reporters for a given asset
      parameters:
        - name: sac
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV report history, paginated internally
          headers:
            Content-Disposition:
              description: Indicates that the CSV is an attachment
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                example: |-
                  ledger,timestamp,reporter,bps,tier,doc_uri
                  42,2026-10-05T12:00:00Z,G...,10200,issuer_signed,https://example.test/report
        '400':
          description: Invalid date parameter, or sac is not a contract strkey

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{sac}/coverage:
    get:
      summary: Get a time series of coverage at a minimum tier
      description: >-
        Each point uses the latest supply snapshot and the best report posted
        at or before its instant, chosen with the same tier and basis-point
        rules as coverage() on-chain. A point's coverage is null when no supply
        snapshot or no qualifying report was known then.
      operationId: getCoverageSeries
  /v1/assets/{sac}/vault:
    get:
      summary: Get indexed vault metadata for an asset
      operationId: getAssetVault
      parameters:
        - name: sac
          in: path
          required: true
          description: Stellar Asset Contract (SAC) address
          schema:
            type: string
            pattern: '^C[A-Z2-7]{55}$'
        - name: from
          in: query
          required: false
          description: Start of the series as an RFC 3339 timestamp (defaults to 24 hours before to)
          schema:
            type: string
            format: date-time
            example: "2026-11-24T12:00:00Z"
        - name: to
          in: query
          required: false
          description: End of the series as an RFC 3339 timestamp (defaults to now)
          schema:
            type: string
            format: date-time
            example: "2026-11-25T12:00:00Z"
        - name: interval
          in: query
          required: false
          description: Distance between points, from 5m to 7d; at most 1000 points per request
          schema:
            type: string
            pattern: '^[0-9]+(m|h|d)$'
            default: 1h
            example: "1h"
        - name: min_tier
          in: query
          required: false
          description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
          schema:
            type: integer
            enum: [1, 2, 3]
            default: 1
      responses:
        '200':
          description: Coverage time series, oldest point first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageSeries'
        '400':
          description: Invalid sac, min_tier, timestamp, interval, or more than 1000 points
      responses:
        '200':
          description: Vault metadata for the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          description: sac is not a contract strkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/AssetNotFound'
          description: No vault indexed for the asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/issuers/{issuer}/toml:
    get:
      summary: Get the latest cached stellar.toml snapshot for an issuer
      operationId: getIssuerToml
      parameters:
        - name: issuer
          in: path
          required: true
          description: Stellar issuer account public key
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
            example: "GBIE3ANCRVCBWETUZXWYKRMP27LQVJHX757XXAQUT3LYHVTNFPPPXEY4"
      responses:
        '200':
          description: Latest cached stellar.toml snapshot
          headers:
            Last-Modified:
              description: HTTP-date timestamp when the snapshot was most recently fetched
              schema:
                type: string
                example: "Tue, 24 Nov 2026 15:00:00 GMT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerTomlSnapshot'
        '400':
          description: issuer is not a Stellar account public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Issuer has not been synced yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/reporters:
    get:
      summary: List registered reporters, roles, and profile metadata
      operationId: listReporters
      responses:
        '200':
          description: List of registered reporters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reporter'
  /v1/webhooks/test:
                type: object
                properties:
                  reporters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporter'
                required:
                  - reporters
  /v1/events:
    get:
      summary: Stream ingested contract events as server-sent events
      operationId: streamEvents
      description: |
        Emits `asset_listed`, `supply_posted` and `reserve_posted` frames as
        they commit during ingestion, so a client does not have to poll. Each
        frame's `data` is the same JSON the corresponding REST resource serves.
        Send the `id` of the last frame received as `Last-Event-ID` when
        reconnecting to replay missed events from storage. `: keepalive`
        comments are sent on idle connections.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Event id to resume after; the last `id` the client received.
          schema:
            type: string
            example: "0023421401557905408-0000000000"
      responses:
        '200':
          description: >-
            Server-sent event stream. Frames carry an `id`, an `event` name
            (`asset_listed`, `supply_posted` or `reserve_posted`) and a single
            JSON `data` line.
          content:
            text/event-stream:
              schema:
                type: string
        '503':
          description: Streaming is not configured, or the subscriber cap is reached
  /v1/breakdowns/{hash}:
    get:
      summary: Get raw supply breakdown by hash
      operationId: getBreakdown
      parameters:
        - $ref: '#/components/parameters/BreakdownHash'
      responses:
        '200':
          description: Raw JSON breakdown served verbatim
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Hash is not 64 hex characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Breakdown hash not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks:
    post:
      summary: Register an issuer TOML change webhook endpoint
      operationId: createWebhook
      description: >-
        Registers one HTTPS endpoint for the authenticated API key. A key may
        register up to 10 endpoints; every event is delivered to all of them.
        The signing secret is shown only in this response. Endpoints created
        before endpoints were keyed remain visible to every key.
      security:
        - WebhookAdminAuth: []
        - WebhookOwnerAuth: []
      summary: Send a test event to a registered webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://example.com/plimsoll-hook"
              required: [url]
      responses:
        '201':
          description: Webhook created; secret is shown only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhook'
        '400':
          description: Invalid URL or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The key already has 10 registered endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/WebhooksNotConfigured'
    get:
      summary: List the authenticated key's webhooks and their delivery state
      operationId: listWebhooks
      security:
        - WebhookAdminAuth: []
                id:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: integer
components:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
                required: [webhooks]
        '401':
          description: Missing or invalid administrator token
        '503':
          description: Webhook management is not configured
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/WebhooksNotConfigured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks/{id}/dlq:
    get:
      summary: List failed webhook deliveries (dead letters)
      description: |
        Returns failed delivery attempts for one webhook, newest first, with
        the latency measured from sending the request to receiving the
        complete response.
      operationId: listWebhookDLQ
      security:
        - WebhookAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Maximum number of failed attempts to return (1-1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Failed webhook deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                required: [deliveries]
        '400':
          description: Invalid webhook id or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook management is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhooks/{id}:
    delete:
      summary: Delete a registered webhook
      operationId: deleteWebhook
      security:
        - WebhookAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/WebhookID'
      responses:
        '204':
          description: Webhook deleted
        '400':
          description: Invalid webhook ID
        '401':
          description: Missing or invalid administrator token
        '404':
          description: Webhook not found
  /v1/stats:
    get:
      summary: Aggregate indexer statistics
      description: >-
        Counts across the indexed set. The response is cached in memory for up
        to 60 seconds, so values may lag the database by that much.
      operationId: getStats
      responses:
        '200':
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '500':
          description: Statistics could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/breakdowns/{hash}:
    get:
      summary: Get raw supply breakdown by hash
      operationId: getBreakdown
      parameters:
        - name: hash
          in: path
          required: true
          description: SHA-256 breakdown hash, 64 hex characters
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Raw JSON breakdown served verbatim
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: Hash is not 64 hex characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Breakdown hash not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Webhook not found
components:
  # Hand-maintained part of the generated OpenAPI document: schemas, shared
  # parameters, shared responses and the auth scheme. Endpoints are not listed
  # here; they come from the route table in routes.go. Run `make generate` after
  # editing this file.
  securitySchemes:
    WebhookAdminAuth:
      type: http
      scheme: bearer
  headers:
    ETag:
      description: Validator for the response body. Send it back in If-None-Match and the server answers 304 Not Modified while the body is unchanged.
      schema:
        type: string
        example: '"3f7a9c0d8b1e4a6c2d5f8e0b3a7c9d1e"'
  responses:
    NotModified:
      description: The client's cached copy is still current; the body is empty.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
  parameters:
    SAC:
      name: sac
      in: path
      required: true
      description: Stellar Asset Contract (SAC) address
      schema:
        type: string
        pattern: '^C[A-Z2-7]{55}$'
        example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
    MinTier:
      name: min_tier
      in: query
      required: false
      description: Minimum tier level (1=transcribed, 2=issuer_signed, 3=auditor_signed)
      schema:
        type: integer
        enum: [1, 2, 3]
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of rows to return (1-1000)
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    BreakdownHash:
      name: hash
      in: path
      required: true
      description: SHA-256 breakdown hash, 64 hex characters
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{64}$'
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    InvalidRequest:
      description: Invalid request parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetNotFound:
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid administrator token
    WebhooksNotConfigured:
      description: Webhook management is not configured
  schemas:
    BuildInfo:
      type: object
      properties:
        version:
          type: string
          example: "v1.2.3"
        commit:
          type: string
          example: "9fceb02d0ae598e95dc970b74767f19372d61af8"
        go:
          type: string
          example: "go1.27.0"
      required:
        - version
        - commit
        - go
    NetworkInfo:
    Reporter:
      type: object
      required:
        - network_passphrase
        - rpc_url
        - horizon_url
        - coverage_ledger_id
        - reporter_registry_id
    Supply:
      type: object
      properties:
        amount:
          type: string
          example: "10000000000"
        ledger:
          type: integer
          example: 100
        posted_at:
          type: string
          format: date-time
          example: "2026-10-05T11:00:00Z"
        breakdown_hash:
          type: string
          example: "abc"
        poster:
          type: string
          example: "GPOST..."
        tx_hash:
          type: string
          example: "tx123..."
        source:
          type: string
          enum: [event, chain]
          description: >
            event for a figure decoded from a contract event, which carries the
            transaction that produced it; chain for one recovered from contract
            state after an ingestion gap, where tx_hash is empty.
      required:
        - amount
        - ledger
        - posted_at
        - breakdown_hash
        - poster
        - tx_hash
    Report:
      type: object
      properties:
        tier:
          type: string
          enum: [transcribed, issuer_signed, auditor_signed]
          example: "issuer_signed"
        amount:
          type: string
          example: "10200000000"
        as_of:
          type: string
          format: date-time
          example: "2026-10-05T10:00:00Z"
        posted_at:
          type: string
          format: date-time
          example: "2026-10-05T10:05:00Z"
        reporter:
          type: string
          example: "GISS..."
        doc_hash:
          type: string
          example: "dochash123..."
        doc_uri:
          type: string
          example: "https://x"
        tx_hash:
          type: string
          example: "tx456..."
        source:
          type: string
          enum: [event, chain]
        doc_check:
          type: string
          enum: [match, mismatch, unreachable]
          description: Result of the last document hash verification; absent until checked.
      required:
        - tier
        - amount
        - as_of
        - posted_at
        - reporter
        - tier
        - last_post_at
      properties:
        reporter:
          type: string
          example: "GISS..."
        doc_uri:
          type: string
          example: "https://x"
      required:
        - bps
        - ratio
        - tier
        - supply
        - reserves
        - supply_ledger
        - supply_posted_at
        - report_as_of
        - report_age_seconds
        - supply_age_seconds
        - reporter
        - doc_uri
    Asset:
      type: object
      properties:
        sac:
          type: string
          example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        code:
          type: string
          example: "PUSD"
        issuer:
          type: string
          example: "GISS..."
        listed_ledger:
          type: integer
          example: 50
        listed_at:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00Z"
        toml:
          type: [object, "null"]
          description: >-
            The issuer's SEP-1 data. When the asset's stellar.toml lists
            `attestation_of_reserve`, the object also carries
            `attestation_hash` (SHA-256 of the document, lower-case hex),
            `attestation_first_seen_at` (when that version was first observed)
            and, once an earlier document has been replaced,
            `attestation_changed_at`.
          properties:
            attestation_hash:
              type: string
              example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
            attestation_first_seen_at:
              type: string
              format: date-time
              example: "2026-10-01T09:00:00Z"
            attestation_changed_at:
              type: [string, "null"]
              format: date-time
        toml_checked_at:
          type: [string, "null"]
          format: date-time
        toml_error:
          type: [string, "null"]
        supply:
          oneOf:
            - $ref: '#/components/schemas/Supply'
            - type: "null"
        reports:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Report'
        coverage:
          oneOf:
            - $ref: '#/components/schemas/Coverage'
            - type: "null"
      required:
        - sac
        - code
        - issuer
        - listed_ledger
        - listed_at
        - toml
        - toml_checked_at
        - toml_error
        - supply
        - reports
        - coverage
    CoveragePoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
          example: "2026-11-25T12:00:00Z"
        coverage:
          oneOf:
            - $ref: '#/components/schemas/Coverage'
            - type: "null"
      required: [at, coverage]
    CoverageSeries:
      type: object
      properties:
        sac:
          type: string
          example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        min_tier:
          type: string
          example: "transcribed"
        interval:
          type: string
          example: "1h"
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/CoveragePoint'
      required: [sac, min_tier, interval, from, to, points]
    Reporter:
      type: object
      properties:
        role:
          type: string
          example: "auditor"
        address:
          type: string
          example: "GAUD..."
        name:
          type: string
          example: "Acme"
        display_name:
          type: string
          example: "Acme Inc."
        website_uri:
          type: [string, "null"]
          format: uri
          example: "https://acme.example"
        contact_hash:
          type: [string, "null"]
          description: Hash of the reporter's contact details.
          example: "sha256:..."
        updated_at:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00Z"
      required:
        - role
        - address
        - name
        - display_name
        - website_uri
        - contact_hash
        - updated_at
    CoverageWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: "https://integrator.example/plimsoll"
        sac:
          type: string
          example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        min_bps:
          type: integer
          minimum: 1
          maximum: 10000
          example: 9500
        min_tier:
          type: integer
          enum: [1, 2, 3]
          example: 2
      required:
        - url
        - sac
        - min_bps
        - min_tier
    ChangelogEntry:
      type: object
      properties:
        version:
          type: string
          example: "1.2.0"
        date:
          type: string
          format: date
          example: "2026-12-01"
        changes:
          type: array
          description: Breaking changes introduced in this version; empty when there were none.
          items:
            $ref: '#/components/schemas/ChangelogChange'
      required:
        - version
        - date
        - changes
    ChangelogChange:
      type: object
      properties:
        kind:
          type: string
          description: 'What broke: removed_field, renamed_endpoint, new_required_param, and similarly named breakages.'
          example: "removed_field"
        detail:
          type: string
          description: What a client must change.
          example: "coverage.ratio was removed; compute it from bps."
      required:
        - kind
        - detail
    Dispute:
      type: object
      properties:
        reporter:
          type: string
          description: Account that signed the disputed reserve report.
          example: "GISS..."
        disputer:
          type: string
          description: Watcher that opened the dispute.
          example: "GWATCH..."
        status:
          type: string
          enum: [open, resolved]
        resolution:
          type: string
          description: Outcome recorded when the dispute was resolved; empty while open.
          example: "upheld"
        report_as_of:
          type: string
          format: date-time
          description: as_of timestamp of the disputed report.
        hold_until_ledger:
          type: integer
          description: First ledger at which the hold period has elapsed.
        opened_ledger:
          type: integer
        opened_at:
          type: string
          format: date-time
        resolved_ledger:
          type: integer
          description: Ledger the dispute was resolved in; absent while open.
        resolved_at:
          type: string
          format: date-time
          description: When the dispute was resolved; absent while open.
        tx_hash:
          type: string
          description: Transaction that opened or last changed the dispute.
      required:
        - reporter
        - disputer
        - status
        - report_as_of
        - opened_ledger
        - opened_at
    Webhook:
    Stats:
      type: object
      description: Aggregate counts over the indexed data.
      properties:
        totalAssets:
          type: integer
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        delivery:
          $ref: '#/components/schemas/WebhookDelivery'
      required: [id, url, created_at, delivery]
    WebhookDelivery:
      type: object
      description: Delivery state for one endpoint. Events fan out to every endpoint, so each succeeds or fails on its own.
      properties:
        deliveries:
          type: integer
          description: Total delivery attempts recorded for this endpoint.
          example: 12
        failures:
          type: integer
          description: Attempts that did not receive a 2xx response.
          example: 1
        last_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-26T09:00:00Z"
        last_status:
          type: string
          enum: [delivered, failed]
          example: failed
        last_error:
          type: string
          description: Why the last attempt failed; omitted after a success.
          example: webhook returned status 500
      required: [deliveries, failures, last_at]
    CreatedWebhook:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret:
              type: string
              description: Returned once; store it securely.
          required: [secret]
    CoverageWebhook:
    WebhookDLQ:
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
        sac:
          type: string
        min_bps:
          type: integer
        min_tier:
          type: integer
        last_post_at:
          type: string
          format: date-time
      required:
        - id
        - url
        - sac
        - min_bps
        - min_tier
        - created_at
        payload:
          type: object
          description: Original JSON payload sent to the webhook
        last_error:
          type: string
        attempts:
          type: integer
          description: Total delivery attempts, including retries
        failed_at:
          type: string
          format: date-time
      required: [id, payload, last_error, attempts, failed_at]
          format: int64
          description: Assets listed on the coverage ledger.
          example: 12
        coveredAssets:
          type: integer
          format: int64
          description: >-
            Assets with a supply snapshot and at least one reserve report, so
            coverage can be computed for them.
          example: 9
        totalReporters:
          type: integer
          format: int64
          description: Reporters ever registered, revoked ones included.
          example: 5
        activeReporters:
          type: integer
          format: int64
          description: Reporters currently holding a role.
          example: 3
        reportsToday:
          type: integer
          format: int64
          description: Reserve reports posted since 00:00 UTC today.
          example: 7
        ingestLagSeconds:
          type: integer
          format: int64
          description: >-
            Seconds since the last contract event was written; 0 when no event
            has been ingested yet or the last event is dated in the future.
          example: 42
      required:
        - totalAssets
        - coveredAssets
        - totalReporters
        - activeReporters
        - reportsToday
        - ingestLagSeconds
        webhook_id:
          type: integer
        event:
          type: string
          example: issuer_toml_changed
        status_code:
          type: integer
          description: HTTP status returned by the destination, or 0 when no response arrived.
        error:
          type: string
        delivery_latency_ms:
          type: integer
          description: |
            Milliseconds from sending the request to receiving the complete
            response, so slow upstream endpoints are visible next to failures.
          minimum: 0
          example: 912
        attempted_at:
          type: string
          format: date-time
      required: [id, webhook_id, event, status_code, error, delivery_latency_ms, attempted_at]
    ErrorResponse:
      type: object
      description: |
        Body of every 4xx and 5xx response, including the 404 and 405 the
        router writes for an unknown path or method.
      properties:
        code:
          type: string
          description: |
            Machine-readable error identifier. Match on this value, not on
            `message`. Handlers use: not_found, invalid_sac,
            asset_not_listed, invalid_breakdown_hash, breakdown_not_found,
            coverage_not_found, invalid_min_tier, invalid_limit, invalid_body,
            invalid_webhook_url, invalid_webhook_id, webhook_not_found,
            webhook_limit_reached, webhook_forbidden, webhooks_not_configured,
            unauthorized, internal_error, db_unavailable and progress_unavailable.
            The router uses
            webhooks_not_configured, unauthorized, internal_error,
            db_unavailable, progress_unavailable, vault_not_found,
            invalid_issuer and issuer_toml_not_found. The router uses
            not_found, method_not_allowed and internal_error.
          example: asset_not_listed
        message:
          type: string
          description: Human-readable explanation for logs and debugging.
          example: asset not listed
        details:
          type: object
          additionalProperties: true
          description: |
            Optional context identifying what was rejected, such as the
            offending query parameter and its value. Omitted when there is
            nothing to add.
          example:
            parameter: min_tier
            value: "9"
      required:
        - code
        - message
    Vault:
      type: object
      properties:
        sac:
          type: string
          example: "CCHPT4TEJDPZQDSUVW3NP6A35ROGV4WEFZKT45SKWYCFZSUB7R5HIM7S"
        vault_address:
          type: string
          example: "CC3SUECAJSAC4PBV4QLUII7X5Y4WNVL5YGTBAQ4CHCAH6R3QLRYJUZHQ"
        reserve_balance:
          type: string
          example: "10000000000"
        threshold_bps:
          type: integer
          example: 10000
        updated_at:
          type: string
          format: date-time
          example: "2026-10-05T12:00:00Z"
      required:
        - sac
        - vault_address
        - reserve_balance
        - threshold_bps
        - updated_at
    IssuerTomlSnapshot:
      type: object
      properties:
        issuer:
          type: string
          example: "GBIE3ANCRVCBWETUZXWYKRMP27LQVJHX757XXAQUT3LYHVTNFPPPXEY4"
        home_domain:
          type: string
          example: "example.money"
        sha256_hash:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        content:
          type: string
          example: "VERSION = \"2.7.0\"\n"
        fetched_at:
          type: string
          format: date-time
          example: "2026-11-24T15:00:00Z"
      required:
        - issuer
        - home_domain
        - sha256_hash
        - content
        - fetched_at
