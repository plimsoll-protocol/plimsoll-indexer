# Throwaway Postgres for CI: every run starts from an empty database so all
# migrations are applied from scratch, in sequence. Used by
# scripts/ci-migration-test.sh.
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plimsoll
      POSTGRES_PASSWORD: plimsoll
      POSTGRES_DB: plimsoll_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plimsoll -d plimsoll_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "${TEST_DB_PORT:-54330}:5432"
