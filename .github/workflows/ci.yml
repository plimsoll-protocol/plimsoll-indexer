name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          go build -trimpath \
            -ldflags="-X github.com/plimsoll-protocol/plimsoll-indexer/internal/buildinfo.Version=${GITHUB_REF_NAME} \
              -X github.com/plimsoll-protocol/plimsoll-indexer/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o bin/plimsoll-indexer ./cmd/plimsoll-indexer
        run: go build -o bin/plimsoll-indexer ./cmd/plimsoll-indexer
      - name: Verify OpenAPI spec
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc6
          make generate
          git diff --exit-code docs/openapi.yaml
      # The published spec is generated from the API's route table. Regenerate
      # it and fail when the result differs from what is committed, so an
      # undocumented API change cannot land.
      - name: OpenAPI spec is committed
        run: make generate && git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: staticcheck
        run: staticcheck ./...
