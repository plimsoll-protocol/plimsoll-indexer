components:
  schemas:
    api.NetworkInfo:
      properties:
        coverage_ledger_id:
          type: string
        horizon_url:
          type: string
        network_passphrase:
          type: string
        reporter_registry_id:
          type: string
        rpc_url:
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: OpenAPI 3.0 specification for Plimsoll read API over HTTP.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Plimsoll Indexer API
  version: 1.0.0
openapi: 3.1.0
paths:
  /docs:
    get:
      description: Serves Swagger UI documentation for the indexer API.
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: HTML documentation page
      summary: Interactive API documentation
      tags:
      - docs
  /healthz:
    get:
      description: Reports database reachability and progress of the contract event
        ingestion loop.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Service Unavailable
      summary: Health check and indexer sync status
      tags:
      - system
  /metrics:
    get:
      description: Exposes standard Go runtime metrics plus custom indexer metrics.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Prometheus text exposition format
      summary: Prometheus metrics endpoint
      tags:
      - metrics
  /openapi.yaml:
    get:
      description: Serves the OpenAPI specification in YAML format.
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: OpenAPI YAML specification
      summary: Get OpenAPI 3.0 specification
      tags:
      - docs
  /v1/assets:
    get:
      description: Returns all assets currently tracked on the coverage ledger.
      parameters:
      - description: Minimum report tier (1=transcribed, 2=issuer_signed, 3=auditor_signed)
        in: query
        name: min_tier
        schema:
          default: 1
          enum:
          - 1
          - 2
          - 3
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      summary: List all tracked assets with coverage and reports
      tags:
      - assets
  /v1/assets/{sac}:
    get:
      description: Returns the specified asset with its coverage calculation and report
        history.
      parameters:
      - description: Stellar Asset Contract address
        in: path
        name: sac
        required: true
        schema:
          type: string
      - description: Minimum report tier
        in: query
        name: min_tier
        schema:
          default: 1
          enum:
          - 1
          - 2
          - 3
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      summary: Get asset details, latest supply, reports, and coverage
      tags:
      - assets
    head:
      description: Returns 200 when the asset is listed and 404 when it is not, so
        clients can check existence without downloading the full asset document. The
        response never has a body.
      operationId: headAsset
      parameters:
      - description: Stellar Asset Contract address
        in: path
        name: sac
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Asset is listed. No response body.
        "400":
          description: sac is not a contract strkey. No response body.
        "404":
          description: Asset is not listed. No response body.
      summary: Check whether an asset is listed
      tags:
      - assets
  /v1/assets/{sac}/reports:
    get:
      description: Returns historical reserve reports submitted for an asset.
      parameters:
      - description: Stellar Asset Contract address
        in: path
        name: sac
        required: true
        schema:
          type: string
      - description: Max reports to return
        in: query
        name: limit
        schema:
          default: 50
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Get historical reserve reports for an asset
      tags:
      - reports
  /v1/assets/{sac}/supply:
    get:
      description: Returns historical supply snapshots posted on chain for an asset.
      parameters:
      - description: Stellar Asset Contract address
        in: path
        name: sac
        required: true
        schema:
          type: string
      - description: Max snapshots to return
        in: query
        name: limit
        schema:
          default: 50
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: Get historical supply snapshots for an asset
      tags:
      - supply
  /v1/breakdowns/{hash}:
    get:
      description: Serves the canonical JSON breakdown stored for a posted supply
        snapshot.
      parameters:
      - description: Hex-encoded SHA-256 hash of the breakdown JSON
        in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Canonical JSON breakdown
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      summary: Get canonical supply breakdown by hash
      tags:
      - breakdowns
  /v1/changelog:
    get:
      description: Machine-readable changelog, newest version first, generated from
        CHANGELOG.yaml.
      operationId: getChangelog
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: List breaking changes per released API version
      tags:
      - changelog
  /v1/network:
    get:
      description: Discover network parameters and contract IDs for client configuration.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.NetworkInfo'
          description: OK
      summary: Discover network parameters and contract IDs
      tags:
      - network
  /v1/reporters:
    get:
      description: Returns all active registered reporters and their roles.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
      summary: List authorized reporters
      tags:
      - reporters
  /v1/webhooks:
    get:
      description: Returns all registered webhook destinations without sensitive secret
        material.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Service Unavailable
      summary: List registered webhooks without their secrets
      tags:
      - webhooks
    post:
      description: Register a webhook to receive notifications when issuer TOML changes.
        Secret is returned only once at creation.
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              title: body
              type: object
        description: Webhook configuration with url
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Service Unavailable
      summary: Register an issuer TOML change webhook
      tags:
      - webhooks
  /v1/webhooks/{id}:
    delete:
      description: Removes a registered webhook by ID.
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Webhook deleted
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Service Unavailable
      summary: Delete a registered webhook
      tags:
      - webhooks
servers:
- url: /
